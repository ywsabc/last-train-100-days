name: Build

on: [push, pull_request]

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          fetch-tags: true

      - name: Setup JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Verify installer safety tests
        run: ./scripts/tests/install-dev-client-test.sh

      - name: Build with Gradle
        run: ./gradlew build

      - name: Setup Go for Packwiz validation
        uses: actions/setup-go@v5
        with:
          go-version: '1.24.6'

      - name: Install pinned Packwiz
        run: go install github.com/packwiz/packwiz@dfd8b68a4796c763e25bad50265ea1f1233e24f1

      - name: Verify Packwiz index is current
        run: |
          cd pack
          packwiz refresh
          git diff --exit-code -- index.toml pack.toml

      - name: Upload campaign core
        uses: actions/upload-artifact@v4
        with:
          name: lasttrain-core
          path: build/libs/lasttrain-*.jar
          if-no-files-found: error
